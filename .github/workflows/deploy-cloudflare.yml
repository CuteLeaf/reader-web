name: Deploy to Cloudflare Pages

# 只在手动触发时运行，避免没有配置 secrets 的仓库在 push 时报错。
# 需要两个仓库 secret：
#   CLOUDFLARE_API_TOKEN   —— Cloudflare → My Profile → API Tokens，权限选「Cloudflare Pages: Edit」
#   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 控制台右侧的 Account ID

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages 项目名（不存在会自动创建）
        required: false
        default: reader-web
      branch:
        description: 部署到哪个分支环境（production / preview 名称）
        required: false
        default: main

concurrency:
  group: cloudflare-pages-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段提供，不要再在 action 里写 version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，请先在仓库 Settings → Secrets 里配置"
            exit 1
          fi

      # Pages 部署在域名根路径，base 用 /
      - name: Build
        env:
          BASE_PATH: /
          SITE_URL: https://${{ inputs.project_name }}.pages.dev
        run: pnpm build

      - name: Verify dist
        run: |
          test -f dist/index.html
          du -sh dist

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project_name }} --branch=${{ inputs.branch }}
